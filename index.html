<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0;touch-action:manipulation}
html{background:#0b1117;height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(circle at top,#34495e 0%,#17202a 72%);color:#ecf0f1;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto;padding:max(4px,env(safe-area-inset-top)) max(env(safe-area-inset-right),0px) max(4px,env(safe-area-inset-bottom)) max(env(safe-area-inset-left),0px);overscroll-behavior:none}
#game-container{width:100%;max-width:430px;padding:6px 10px 10px;display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-height:calc(100dvh - max(8px, env(safe-area-inset-top) + env(safe-area-inset-bottom)))}
header{width:100%;display:flex;gap:6px;margin-bottom:6px;z-index:9}
.info-panel{flex:1;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);padding:6px 8px;border-radius:12px;text-align:center;font-size:12px}
.info-panel span{font-weight:700;display:inline-block;transition:.2s}
#pause-toggle{flex:0 0 74px;border:1px solid rgba(255,255,255,.12);background:rgba(7,18,28,.78);color:#ecf0f1;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;transition:.22s}
#pause-toggle:active{transform:scale(.97)}
#pause-toggle.paused{background:rgba(22,160,133,.82);border-color:rgba(255,255,255,.2)}
#board-wrapper{position:relative;width:100%;max-width:100%;background:linear-gradient(rgba(44,62,80,.18),rgba(44,62,80,.18)),url('./board-background.png');background-size:cover;background-position:center;border:5px solid #111820;border-radius:10px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.35);transition:.25s}
#board-wrapper.frozen{border-color:#5dade2;box-shadow:0 0 25px #5dade2}
#board-wrapper.frozen:after{content:'❄️';position:absolute;right:10px;top:10px;font-size:22px;z-index:7;animation:spin 6s linear infinite}
#board-wrapper.paused{background:#02070b;box-shadow:0 12px 30px rgba(0,0,0,.62)}
#board-wrapper.paused #grid,
#board-wrapper.paused #water-mask,
#board-wrapper.paused #water-effects-canvas,
#board-wrapper.paused .wall-port{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
#grid{display:grid;width:100%;height:100%;background:rgba(44,62,80,.45)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.045);background:rgba(20,28,36,.12);cursor:pointer}
.cell.solution-hint{box-shadow:inset 0 0 0 1px rgba(241,196,15,.28)}
.obstacle{
 background:url('./brick-wall.png') center center / cover no-repeat;
 border:1px solid #3f241c;
 cursor:not-allowed;
 box-shadow:inset 0 1px 1px rgba(255,255,255,.08), inset 0 -2px 4px rgba(0,0,0,.32);
}
.grid-lvl1 .obstacle:after,.grid-lvl2 .obstacle:after{content:'';position:absolute;inset:0;border-radius:2px;background:linear-gradient(180deg,rgba(255,120,70,.12),rgba(120,10,0,.08))}
#water-mask{position:absolute;left:0;bottom:0;width:100%;height:0%;background:
 linear-gradient(180deg,rgba(143,224,255,.2) 0%,rgba(88,183,233,.16) 18%,rgba(41,128,185,.52) 56%,rgba(22,93,145,.7) 100%);
 backdrop-filter:blur(1px);pointer-events:none;transition:height .1s linear;z-index:5;border-top:2px solid rgba(180,235,255,.9);box-shadow:0 -8px 18px rgba(76,178,255,.15)}
#water-mask::before,#water-mask::after{content:'';position:absolute;left:-12%;width:124%;pointer-events:none}
#water-mask::before{top:-14px;height:26px;background:
 radial-gradient(circle at 10px 18px, rgba(215,247,255,.8) 0 6px, transparent 7px),
 radial-gradient(circle at 45px 10px, rgba(111,206,255,.42) 0 8px, transparent 9px),
 radial-gradient(circle at 78px 17px, rgba(255,255,255,.55) 0 5px, transparent 6px);
 background-size:92px 24px;opacity:.8;filter:blur(.2px);animation:waterWaveDrift 4.4s linear infinite}
#water-mask::after{top:-8px;height:18px;background:linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,0) 78%);opacity:.42;filter:blur(2px);animation:waterWaveSwell 2.6s ease-in-out infinite}
@keyframes waterWaveDrift{from{transform:translateX(0)}to{transform:translateX(-92px)}}
@keyframes waterWaveSwell{0%,100%{transform:translateY(0) scaleX(1)}50%{transform:translateY(-2px) scaleX(1.015)}}
#water-effects-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;opacity:.95}
.wall-port{position:absolute;--port-size:28px;--port-shift-x:0px;--port-shift-y:0px;width:var(--port-size);height:var(--port-size);display:flex;align-items:center;justify-content:center;z-index:8;font-size:14px;border-radius:4px;pointer-events:none;background:none;overflow:hidden;transform-origin:center center}
.wall-port::before{content:'';position:absolute;inset:16%;background-repeat:no-repeat;background-size:contain;background-position:left center;transform:translate(var(--port-shift-x),var(--port-shift-y))}
.wall-inlet{
 background:none;
 border:0;
 filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));
}
.wall-inlet::before{background-image:url('./inlet-pipe-transparent.png')}
.wall-outlet{
 --port-shift-x:calc(var(--port-size) * -0.12);
 background:none;
 border:0;
 filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));
}
.wall-outlet::before{background-image:url('./outlet-pipe-transparent-fixed.png');background-size:122% auto;background-position:center center;filter:contrast(1.06) saturate(.96)}
.wall-outlet.flooded-outlet{
 filter:drop-shadow(0 0 8px #2ecc71) drop-shadow(0 2px 4px rgba(0,0,0,.45));
}
.port-left{left:calc(var(--port-size) * -0.11);top:var(--port-center-y);transform:translateY(-50%) rotate(0deg)}
.port-right{right:calc(var(--port-size) * -0.11);top:var(--port-center-y);transform:translateY(-50%) rotate(180deg)}
.port-top{top:calc(var(--port-size) * -0.11);left:var(--port-center-x);transform:translateX(-50%) rotate(90deg)}
.port-bottom{bottom:calc(var(--port-size) * -0.11);left:var(--port-center-x);transform:translateX(-50%) rotate(270deg)}
#board-wrapper .wall-port:before{content:''}
#board-wrapper .wall-port:after{content:none}
.pipe-wrapper{width:100%;height:100%;position:relative;display:none;transition:transform .15s ease-out}
.pipe-I{position:absolute;background:#95a5a6;border-radius:3px;width:100%;height:30%;top:35%;left:0;display:none}
.pipe-L,.pipe-T{position:absolute;width:100%;height:100%;background:transparent!important}
.pipe-L .seg-v,.pipe-T .seg-v{position:absolute;width:30%;height:50%;left:35%;top:0;background:#95a5a6;border-radius:3px 3px 0 0}
.pipe-T .seg-v{height:100%;border-radius:3px}
.pipe-L .seg-h,.pipe-T .seg-h{position:absolute;width:50%;height:30%;left:50%;top:35%;background:#95a5a6;border-radius:0 3px 3px 0}
.pipe-L .corner,.pipe-T .corner{position:absolute;width:30%;height:30%;left:35%;top:35%;background:#95a5a6}
.pipe-L .corner{border-radius:50%}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.flooded .pipe-I,.flooded .pipe-L .seg-v,.flooded .pipe-L .seg-h,.flooded .pipe-L .corner,.flooded .pipe-T .seg-v,.flooded .pipe-T .seg-h,.flooded .pipe-T .corner{background:#2980b9!important;box-shadow:0 0 8px #3498db;animation:pulse 1.5s infinite ease-in-out}
.pipe-shatter .pipe-wrapper{animation:shatter 1.5s forwards!important}
@keyframes shatter{0%{filter:grayscale(.6) sepia(1) hue-rotate(-50deg) saturate(4);transform:scale(1);opacity:1}15%,45%,75%{transform:scale(.95) translate(2px,-1px) rotate(3deg);opacity:.8}30%,60%{transform:scale(.95) translate(-2px,1px) rotate(-3deg);opacity:.8}100%{filter:grayscale(1);transform:scale(.7);opacity:0}}
.rot-0{transform:rotate(0)}.rot-90{transform:rotate(90deg)}.rot-180{transform:rotate(180deg)}.rot-270{transform:rotate(270deg)}
#toolbar{width:100%;display:flex;gap:5px;margin-top:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.07);padding:6px;border-radius:10px;z-index:9}
.tool-btn{flex:1;background:#34495e;border:2px solid #7f8c8d;color:#ecf0f1;padding:5px 2px;border-radius:8px;cursor:pointer;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
.tool-btn.active{border-color:#f1c40f;background:#1a252f}.tool-btn:active{transform:scale(.97)}.empty-inventory{opacity:.38}
.btn-preview{width:20px;height:20px;background:#95a5a6;border-radius:4px;position:relative}.btn-preview-I{position:absolute;width:20px;height:5px;top:7.5px;left:0;background:#ecf0f1}.btn-preview-L{position:absolute;width:6px;height:10px;top:0;left:7px;background:#ecf0f1}.btn-preview-L:after{content:'';position:absolute;width:10px;height:6px;left:0;top:4px;background:#ecf0f1}.btn-preview-T{position:absolute;width:6px;height:16px;top:2px;left:7px;background:#ecf0f1}.btn-preview-T:after{content:'';position:absolute;width:8px;height:6px;left:6px;top:5px;background:#ecf0f1}
.badge{background:rgba(0,0,0,.5);padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700;color:#f1c40f}
#items-panel{display:flex;gap:8px;margin-top:6px;width:100%;justify-content:center;z-index:9}
.item-btn{background:#16a085;border:0;color:white;padding:6px 12px;border-radius:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;box-shadow:0 3px 6px rgba(0,0,0,.2);transition:.2s}.item-btn:active{transform:scale(.95)}.item-btn.disabled{background:#7f8c8d;opacity:.5;box-shadow:none}.item-count{background:rgba(0,0,0,.3);border-radius:50%;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
#modal{display:none;position:absolute;inset:0;background:rgba(0,0,0,.94);z-index:10;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#modal h2{font-size:24px;line-height:1.45;margin-bottom:10px}#modal button{background:#27ae60;border:0;color:white;padding:10px 24px;font-size:15px;border-radius:6px;cursor:pointer;margin-top:15px}
.tip{margin-top:5px;font-size:10px;color:#bdc3c7;text-align:center;max-width:96%;z-index:9;line-height:1.35}.tip strong{color:#f1c40f}

/* ===== 视觉与音效版美术增强 ===== */
body{
 background:
  radial-gradient(circle at 20% 12%, rgba(52,152,219,.28) 0%, transparent 28%),
  radial-gradient(circle at 82% 18%, rgba(46,204,113,.18) 0%, transparent 24%),
  linear-gradient(145deg,#1b2631 0%,#17202a 45%,#0b1117 100%);
}
#game-container:before{
 content:'';
 position:fixed;
 inset:0;
 pointer-events:none;
 background-image:
  linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
 background-size:28px 28px;
 mask-image:radial-gradient(circle, black 0%, transparent 76%);
}
.info-panel{
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 4px 12px rgba(0,0,0,.22);
}
#board-wrapper{
 border-color:#0d141b;
 box-shadow:0 12px 30px rgba(0,0,0,.45), inset 0 0 18px rgba(255,255,255,.04);
}
.cell{
 background:
  radial-gradient(circle at 35% 30%, rgba(255,255,255,.055), transparent 45%),

 background:url('./brick-wall.png') center center / cover no-repeat;

}
.pipe-I,
.pipe-L .seg-v,.pipe-L .seg-h,.pipe-L .corner,
.pipe-T .seg-v,.pipe-T .seg-h,.pipe-T .corner{

.flooded .pipe-I,
.flooded .pipe-L .seg-v,.flooded .pipe-L .seg-h,.flooded .pipe-L .corner,

 background:
  linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,0) 44%),
  linear-gradient(90deg,#1f78b4,#5dade2 48%,#1f78b4) !important;

.wall-outlet{
 --port-size:clamp(24px, calc((100% / var(--cols)) * .52), 36px);
}
.wall-outlet.flooded-outlet{
 filter:drop-shadow(0 0 8px #2ecc71) drop-shadow(0 2px 4px rgba(0,0,0,.45));
}
.wall-inlet{
 --port-size:clamp(24px, calc((100% / var(--cols)) * .52), 36px);
}

.tool-btn.active{

}
@media (display-mode: standalone){
 body{padding:max(6px,env(safe-area-inset-top)) max(env(safe-area-inset-right),0px) max(8px,env(safe-area-inset-bottom)) max(env(safe-area-inset-left),0px)}
}
#orientation-overlay{display:none;position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,rgba(7,15,23,.95),rgba(11,23,34,.98));align-items:center;justify-content:center;padding:24px;text-align:center}
#orientation-overlay .orientation-card{max-width:320px;padding:22px 20px;border-radius:22px;background:rgba(14,31,45,.88);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 40px rgba(0,0,0,.35)}
#orientation-overlay h2{font-size:24px;letter-spacing:.04em;margin-bottom:10px}
#orientation-overlay p{font-size:14px;line-height:1.5;color:#cdd8e3}
body.landscape-warning #orientation-overlay{display:flex}

#modal.fail-modal{
 background:rgba(0,0,0,.28);
 backdrop-filter:none;
 justify-content:flex-end;
 padding-bottom:18px;
}
#modal.fail-modal h2{
 background:rgba(0,0,0,.72);
 border:1px solid rgba(255,255,255,.12);
 border-radius:12px;
 padding:14px 16px;
 box-shadow:0 8px 24px rgba(0,0,0,.38);
}

}

 display:none;
 background:#e67e22!important;

#pause-overlay{
 display:none;
 position:absolute;
 inset:0;
 z-index:11;
 background:
  radial-gradient(circle at center, rgba(31,91,126,.34), rgba(1,7,13,.96) 72%),
  linear-gradient(180deg, rgba(0,0,0,.84), rgba(0,0,0,.96));
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:24px;
 backdrop-filter:blur(10px);
}
#pause-overlay.active{display:flex}
.pause-card{
 width:min(88%,320px);
 padding:26px 20px;
 border-radius:22px;
 border:1px solid rgba(255,255,255,.12);
 background:rgba(9,20,30,.78);
 box-shadow:0 16px 42px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
}
.pause-card h2{font-size:30px;letter-spacing:.14em;margin-bottom:12px}
.pause-card p{font-size:13px;line-height:1.7;color:#c7d8e6}
.pause-card button{margin-top:16px;padding:10px 20px;border:0;border-radius:999px;background:linear-gradient(135deg,#4db6ac,#0f766e);color:#f6feff;font-weight:700;cursor:pointer}
.answer-moving .pipe-wrapper{
 transition:transform .55s cubic-bezier(.2,.8,.2,1), opacity .35s ease-out!important;
}
.answer-ghost{

 z-index:9;
 pointer-events:none;

.answer-ghost .pipe-wrapper{

 width:100%;
 height:100%;
}
.answer-hint-flash{
 animation:answerFlash .9s ease-in-out 2;
}
@keyframes answerFlash{
 0%,100%{box-shadow:inset 0 0 0 1px rgba(46,204,113,.18)}
 50%{box-shadow:inset 0 0 0 2px rgba(46,204,113,.85),0 0 12px rgba(46,204,113,.45)}
}

#intro-screen{
 position:fixed;
 inset:0;
 z-index:30;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:24px;
 background:
  radial-gradient(circle at 50% 18%, rgba(113,196,255,.24), transparent 24%),
  radial-gradient(circle at 20% 20%, rgba(27,153,139,.18), transparent 20%),
  linear-gradient(180deg, #07111a 0%, #091722 45%, #03070d 100%);

#intro-screen:after{

.intro-card{

 content:'';
 position:absolute;

}
.intro-avatar{
 position:relative;
 width:152px;
 height:152px;
 margin:0 auto 20px;
 border-radius:50%;
 overflow:hidden;
 border:4px solid rgba(214,240,255,.92);
 box-shadow:0 0 0 10px rgba(93,173,226,.12), 0 18px 40px rgba(0,0,0,.36);

}
.intro-avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
 transform:scale(1.06);
}
.intro-avatar:before,
.intro-avatar:after{
 content:'';

 inset:-12%;
 border-radius:50%;
 border:2px solid rgba(147,220,255,.34);
 animation:rippleExpand 2.8s infinite ease-out;
}
.intro-avatar:after{animation-delay:1.2s}
.intro-title{

}
.intro-title .wave{

 animation:letterWave 1.8s ease-in-out infinite;
}
.intro-title .wave:nth-child(2){animation-delay:.12s}
.intro-title .wave:nth-child(3){animation-delay:.24s}
.intro-title .wave:nth-child(4){animation-delay:.36s}
.intro-title .wave:nth-child(5){animation-delay:.48s}
.intro-title .wave:nth-child(6){animation-delay:.6s}
.intro-title .wave:nth-child(7){animation-delay:.72s}
.intro-title .wave:nth-child(8){animation-delay:.84s}
.intro-subtitle{
 font-size:14px;
 color:#a9bfd0;
 letter-spacing:.18em;
 margin-bottom:22px;
}
.intro-start{
 border:0;
 border-radius:999px;
 padding:12px 28px;
 font-size:14px;

<body>

<script>
let ROWS=8,COLS=6;
const LEVEL1={
 rows:8,cols:6,duration:55,freezeCount:1,pumpCount:1,mustConnectAllInlets:false,showSolutionHint:true,
 inlets:[{r:2,c:0,dir:3}],outlets:[{r:5,c:5,dir:1}],
 solutionPath:[{r:2,c:0},{r:2,c:1},{r:2,c:2},{r:2,c:3},{r:3,c:3},{r:4,c:3},{r:5,c:3},{r:5,c:4},{r:5,c:5}],
 fixedInventory:{I:7,L:2,T:0}
};
const LEVEL2={rows:16,cols:12,duration:125,freezeCount:1,pumpCount:1,mustConnectAllInlets:true,showSolutionHint:false};
let gridState=[],currentTool='I',waterLevel=0,currentStep=0,isGameOver=false,timerInterval=null,currentLevel=1,score=0,levelWon=false;
let freezeCount=1,pumpCount=1,isFrozen=false,freezeTicksRemaining=0,inventory={I:0,L:0,T:0},currentInlets=[],currentOutlets=[],currentSolutionCells=new Set(),currentSolutionEdges=[];
let audioCtx=null;
let answerRevealMode=false;
let waitingForNextAfterReveal=false;
let isPaused=false;
let hasStartedGame=false;
let waterEffects=null;

class WaterParticleSystem{
 constructor(canvas){
  this.canvas=canvas;
  this.ctx=canvas.getContext('2d',{alpha:true});
  this.particles=[];
  this.maxParticles=280;
  this.boardRect={width:0,height:0};
  this.deviceScale=1;
  this.scene={flooded:new Set(),leaks:[],brokenCells:[],inlets:[]};
  this.waterLevel=0;
  this.lastFrame=0;
  this.lastEmit=0;
  this.running=false;
  this.resize();
  this.loop=this.loop.bind(this);
 }
 resize(){
  const board=this.canvas.parentElement;
  if(!board)return;
  const width=Math.max(1,Math.round(board.clientWidth));
  const height=Math.max(1,Math.round(board.clientHeight));
  const dpr=Math.min(window.devicePixelRatio||1,2);
  if(width===this.boardRect.width&&height===this.boardRect.height&&dpr===this.deviceScale)return;
  this.boardRect={width,height};
  this.deviceScale=dpr;
  this.canvas.width=Math.round(width*dpr);
  this.canvas.height=Math.round(height*dpr);
  this.ctx.setTransform(dpr,0,0,dpr,0,0);
 }
 start(){
  if(this.running)return;
  this.running=true;
  this.lastFrame=performance.now();
  this.lastEmit=this.lastFrame;
  requestAnimationFrame(this.loop);
 }
 stop(){this.running=false}
 reset(){
  this.particles.length=0;
  this.clear();
 }
 clear(){
  this.ctx.clearRect(0,0,this.boardRect.width,this.boardRect.height);
 }
 setScene(scene){
  this.scene=scene;
 }
 setWaterLevel(level){
  this.waterLevel=level;
 }
 getCellSize(){
  return{
   cellW:this.boardRect.width/Math.max(COLS,1),
   cellH:this.boardRect.height/Math.max(ROWS,1)
  };
 }
 getDirectionVector(dir){
  if(dir===3)return{x:1,y:0};
  if(dir===1)return{x:-1,y:0};
  if(dir===0)return{x:0,y:1};
  return{x:0,y:-1};
 }
 getPortOrigin(port,offset=.36){
  const {cellW,cellH}=this.getCellSize();
  const cx=(port.c+.5)*cellW;
  const cy=(port.r+.5)*cellH;
  if(port.dir===3)return{x:port.c*cellW+cellW*.08,y:cy};
  if(port.dir===1)return{x:(port.c+1)*cellW-cellW*.08,y:cy};
  if(port.dir===0)return{x:cx,y:port.r*cellH+cellH*.08};
  return{x:cx,y:(port.r+1)*cellH-cellH*.08-offset};
 }
 getLeakOrigin(leak){
  const {cellW,cellH}=this.getCellSize();
  const cx=(leak.c+.5)*cellW;
  const cy=(leak.r+.5)*cellH;
  if(leak.dir===3)return{x:leak.c*cellW+2,y:cy};
  if(leak.dir===1)return{x:(leak.c+1)*cellW-2,y:cy};
  if(leak.dir===0)return{x:cx,y:leak.r*cellH+2};
  return{x:cx,y:(leak.r+1)*cellH-2};
 }
 emitParticle(x,y,vx,vy,opts={}){
  if(this.particles.length>=this.maxParticles)this.particles.shift();
  this.particles.push({
   x,y,vx,vy,
   life:opts.life??(.48+Math.random()*.38),
   age:0,
   radius:opts.radius??(1.4+Math.random()*1.8),
   alpha:opts.alpha??(.7+Math.random()*.2),
   hue:opts.hue??(195+Math.random()*20),
   trail:opts.trail??(6+Math.random()*10),
   drag:opts.drag??.988,
   bounce:opts.bounce??.34,
   gravity:opts.gravity??780,
   stopped:false
  });
 }
 emitSpray(origin,dir,count,speedMin,speedMax,opts={}){
  const vec=this.getDirectionVector(dir);
  const cross={x:-vec.y,y:vec.x};
  for(let i=0;i<count;i++){
   const speed=speedMin+Math.random()*(speedMax-speedMin);
   const spread=(Math.random()-.5)*(opts.spread??.9);
   const lift=(Math.random()-.5)*(opts.lift??24);
   const vx=vec.x*speed+cross.x*speed*spread+lift*(Math.random()-.5)*.12;
   const vy=vec.y*speed+cross.y*speed*spread+lift;
   this.emitParticle(
    origin.x+(Math.random()-.5)*(opts.originJitter??8),
    origin.y+(Math.random()-.5)*(opts.originJitter??8),
    vx,vy,opts
   );
  }
 }
 isObstacleAtPixel(x,y){
  const {cellW,cellH}=this.getCellSize();
  const c=Math.floor(x/cellW);
  const r=Math.floor(y/cellH);
  if(r<0||r>=ROWS||c<0||c>=COLS)return false;
  return gridState[r]?.[c]?.type==='obstacle';
 }
 updateParticles(dt){
  const width=this.boardRect.width,height=this.boardRect.height;
  for(let i=this.particles.length-1;i>=0;i--){
   const p=this.particles[i];
   p.age+=dt;
   if(p.age>=p.life){this.particles.splice(i,1);continue}
   if(p.stopped){
    p.alpha*=.965;
    if(p.alpha<.06){this.particles.splice(i,1);continue}
    continue;
   }
   p.vy+=p.gravity*dt;
   p.vx*=p.drag;
   p.vy*=.997;
   let nx=p.x+p.vx*dt;
   let ny=p.y+p.vy*dt;
   if(nx<0||nx>width){p.vx*=-p.bounce;nx=Math.max(0,Math.min(width,nx))}
   if(ny<0){p.vy*=-p.bounce;ny=0}
   if(ny>height){
    if(Math.abs(p.vy)<120)p.stopped=true;
    p.vy*=-Math.max(.08,p.bounce*.18);
    p.vx*=.8;
    ny=height;
   }
   if(this.isObstacleAtPixel(nx,ny)){
    const hitX=this.isObstacleAtPixel(nx,p.y);
    const hitY=this.isObstacleAtPixel(p.x,ny);
    if(hitX)p.vx*=-p.bounce;
    if(hitY||!hitX)p.vy*=-Math.max(.12,p.bounce*.72);
    if(Math.abs(p.vx)+Math.abs(p.vy)<90)p.stopped=true;
    nx=p.x+p.vx*dt*.35;
    ny=p.y+p.vy*dt*.35;
    if(this.isObstacleAtPixel(nx,ny)){nx=p.x;ny=p.y;p.stopped=true}
   }
   p.x=nx;
   p.y=ny;
  }
 }
 emitContinuous(now){
  const elapsed=now-this.lastEmit;
  if(elapsed<32)return;
  this.lastEmit=now;
  if(isPaused||!hasStartedGame)return;
  this.scene.inlets.forEach(inlet=>{
   const origin=this.getPortOrigin(inlet);
   this.emitSpray(origin,inlet.dir,3,58,128,{life:.65,radius:1.6,trail:12,originJitter:6,spread:.42,gravity:820,bounce:.28});
  });
  this.scene.leaks.forEach(leak=>{
   const origin=this.getLeakOrigin(leak);
   this.emitSpray(origin,leak.dir,3,82,158,{life:.44,radius:1.5,trail:10,originJitter:5,spread:.5,gravity:840,bounce:.24});
  });
  this.scene.brokenCells.forEach(leak=>{
   const origin=this.getLeakOrigin(leak);
   this.emitSpray(origin,leak.dir,6,120,220,{life:.4,radius:1.8,trail:14,originJitter:8,spread:.72,gravity:860,bounce:.3,alpha:.88});
  });
 }
 drawWaterline(now){
  const width=this.boardRect.width,height=this.boardRect.height;
  if(!width||!height||this.waterLevel<=0)return;
  const t=now*.0015;
  const waterHeight=height*(this.waterLevel/100);
  const baseY=height-waterHeight;
  const amplitude=Math.max(2,Math.min(8,height*.014));
  const waveLen=Math.max(34,width*.16);
  this.ctx.save();
  this.ctx.beginPath();
  this.ctx.moveTo(0,height);
  this.ctx.lineTo(0,baseY);
  for(let x=0;x<=width+8;x+=8){
   const y=baseY+Math.sin((x/waveLen)+t)*amplitude+Math.sin((x/(waveLen*.58))-t*1.8)*(amplitude*.45);
   this.ctx.lineTo(x,y);
  }
  this.ctx.lineTo(width,height);
  this.ctx.closePath();
  const fill=this.ctx.createLinearGradient(0,baseY-12,0,height);
  fill.addColorStop(0,'rgba(164,230,255,0.14)');
  fill.addColorStop(.18,'rgba(74,182,235,0.08)');
  fill.addColorStop(1,'rgba(24,105,170,0)');
  this.ctx.fillStyle=fill;
  this.ctx.fill();
  this.ctx.strokeStyle='rgba(214,247,255,0.52)';
  this.ctx.lineWidth=1.25;
  this.ctx.stroke();
  this.ctx.restore();
 }
 drawParticles(){
  for(const p of this.particles){
   const lifeRatio=1-(p.age/p.life);
   const alpha=Math.max(0,p.alpha*lifeRatio);
   if(alpha<=.02)continue;
   const tx=p.x-p.vx*.016;
   const ty=p.y-p.vy*.016;
   this.ctx.strokeStyle=`hsla(${p.hue},85%,65%,${alpha*.38})`;
   this.ctx.lineWidth=Math.max(1,p.radius*.8);
   this.ctx.beginPath();
   this.ctx.moveTo(tx,ty);
   this.ctx.lineTo(p.x,p.y);
   this.ctx.stroke();
   this.ctx.fillStyle=`hsla(${p.hue},92%,66%,${alpha})`;
   this.ctx.beginPath();
   this.ctx.arc(p.x,p.y,p.radius*lifeRatio+.4,0,Math.PI*2);
   this.ctx.fill();
  }
 }
 loop(now){
  if(!this.running)return;
  this.resize();
  const dt=Math.min((now-this.lastFrame)/1000,.028);
  this.lastFrame=now;
  this.emitContinuous(now);
  if(!isPaused){
   this.updateParticles(dt);
  }
  this.clear();
  this.drawWaterline(now);
  this.drawParticles();
  requestAnimationFrame(this.loop);
 }
}

function keyOf(r,c){return `${r},${c}`}
function parseKey(k){const [r,c]=k.split(',').map(Number);return{r,c}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getDir(a,b){if(b.r===a.r-1&&b.c===a.c)return 0;if(b.r===a.r&&b.c===a.c+1)return 1;if(b.r===a.r+1&&b.c===a.c)return 2;if(b.r===a.r&&b.c===a.c-1)return 3;return-1}
function opp(d){return(d+2)%4}
function rotateDirections(base,angle){const s=Math.floor(angle/90),res=[0,0,0,0];for(let i=0;i<4;i++)res[(i+s)%4]=base[i];return res}
function getPipeBaseConnections(t){if(t==='I')return[0,1,0,1];if(t==='L')return[1,1,0,0];if(t==='T')return[1,1,1,0];return[0,0,0,0]}
function getPipeTypeFromDirs(ds){ds=[...ds].sort((a,b)=>a-b);if(ds.length===2&&opp(ds[0])===ds[1])return'I';if(ds.length===2)return'L';if(ds.length===3)return'T';return null}
function ensureAudioContext(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function playSound(freq,type,duration){try{ensureAudioContext();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;o.type=type;g.gain.setValueAtTime(.04,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.005,audioCtx.currentTime+duration);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function playFreezeSound(){playSound(880,'sine',.4);setTimeout(()=>playSound(1200,'sine',.4),100)}
function playPumpSound(){playSound(200,'triangle',.5);setTimeout(()=>playSound(150,'triangle',.5),200)}
function playPipePlaceSound(){playSound(600,'sine',.1)}

function playConnectSound(){
 playPipePlaceSound();
}
function playDangerSound(){
 // 危险爆裂音：低频下滑 + 尖锐警告
 playSound(95,'sawtooth',.45);
 setTimeout(()=>playSound(740,'square',.12),60);
 setTimeout(()=>playSound(520,'square',.16),180);
}
function beginGameFromIntro(){
 if(hasStartedGame)return;
 ensureAudioContext();
 startBGM();
 hasStartedGame=true;
 document.getElementById('intro-screen').classList.add('hidden');
 setTimeout(()=>{document.getElementById('intro-screen').style.display='none'},720);
 resetGame();
}
let bgmTimer=null;
let bgmStep=0;
function startBGM(){
 ensureAudioContext();
 if(bgmTimer)return;
 const notes=[262,330,392,330,294,349,440,349];
 const bass=[131,131,147,147,165,165,147,147];
 bgmTimer=setInterval(()=>{
  if(isGameOver||isFrozen)return;
  const n=notes[bgmStep%notes.length];
  const b=bass[bgmStep%bass.length];
  playSound(n,'triangle',.16);
  if(bgmStep%2===0)playSound(b,'sine',.18);
  bgmStep++;
 },260);
}


function buildGraphFromEdges(edges,inlets,outlets){
 const graph=new Map();
 function add(r,c,d){const k=keyOf(r,c);if(!graph.has(k))graph.set(k,new Set());graph.get(k).add(d)}
 edges.forEach(e=>{const a={r:e[0][0],c:e[0][1]},b={r:e[1][0],c:e[1][1]};const d1=getDir(a,b),d2=getDir(b,a);if(d1>=0){add(a.r,a.c,d1);add(b.r,b.c,d2)}});
 inlets.forEach(p=>{const k=keyOf(p.r,p.c);if(graph.has(k))graph.get(k).add(p.dir)});
 outlets.forEach(p=>{const k=keyOf(p.r,p.c);if(graph.has(k))graph.get(k).add(p.dir)});
 return graph;
}
function inventoryFromGraph(graph){
 const counts={I:0,L:0,T:0},bad=[];
 graph.forEach((s,k)=>{const t=getPipeTypeFromDirs([...s]);if(t)counts[t]++;else bad.push([k,[...s]])});
 return{counts,bad};
}

function rotationForExactDirs(pipeType,dirs){
 const target=[0,0,0,0];
 dirs.forEach(d=>target[d]=1);
 for(let a=0;a<360;a+=90){
  const conns=rotateDirections(getPipeBaseConnections(pipeType),a);
  let ok=true;
  for(let i=0;i<4;i++){
   if(conns[i]!==target[i]){ok=false;break}
  }
  if(ok)return a;
 }
 return 0;
}
function getCurrentAnswerPlacements(){
 const graph=buildGraphFromEdges(currentSolutionEdges,currentInlets,currentOutlets);
 const placements=[];
 graph.forEach((dirs,k)=>{
  const arr=[...dirs];
  const pipeType=getPipeTypeFromDirs(arr);
  if(!pipeType)return;
  const {r,c}=parseKey(k);
  placements.push({r,c,pipeType,rotation:rotationForExactDirs(pipeType,arr)});
 });
 return placements;
}
function applyAnswerToGridAnimated(){
 answerRevealMode=true;
 waitingForNextAfterReveal=false;
 document.getElementById('modal').className='answer-reveal';
 document.getElementById('modal').className='';document.getElementById('modal').style.display='none';

 const board=document.getElementById('board-wrapper');
 const placements=getCurrentAnswerPlacements();
 const existingPipes=[];
 for(let r=0;r<ROWS;r++){
  for(let c=0;c<COLS;c++){
   const cell=gridState[r][c];
   if(cell.type==='pipe'&&!cell.isBroken){
    existingPipes.push({r,c,pipeType:cell.pipeType,rotation:cell.rotation});
   }
  }
 }

 // 先清空所有水管，但保留障碍和 DOM。
 for(let r=0;r<ROWS;r++){
  for(let c=0;c<COLS;c++){
   const cell=gridState[r][c];
   if(cell.type==='pipe'){
    gridState[r][c]={type:'empty',isBroken:false,brokenTime:null,dom:cell.dom,isSolution:cell.isSolution};
   }
  }
 }

 renderGrid(new Set());

 const cellW=board.clientWidth/COLS;
 const cellH=board.clientHeight/ROWS;
 const ghosts=[];

 function makeGhost(pipeType,rotation,fromR,fromC,toR,toC,delay){
  const g=document.createElement('div');
  g.className='answer-ghost';
  g.style.width=cellW+'px';
  g.style.height=cellH+'px';
  g.style.left=(fromC*cellW)+'px';
  g.style.top=(fromR*cellH)+'px';

  const wrap=document.createElement('div');
  wrap.className=`pipe-wrapper rot-${rotation}`;
  const pipeI=document.createElement('div');pipeI.className='pipe-I';
  const pipeL=document.createElement('div');pipeL.className='pipe-L';pipeL.innerHTML='<div class="seg-v"></div><div class="seg-h"></div><div class="corner"></div>';
  const pipeT=document.createElement('div');pipeT.className='pipe-T';pipeT.innerHTML='<div class="seg-v"></div><div class="seg-h"></div><div class="corner"></div>';
  wrap.appendChild(pipeI);wrap.appendChild(pipeL);wrap.appendChild(pipeT);
  pipeI.style.display=pipeType==='I'?'block':'none';
  pipeL.style.display=pipeType==='L'?'block':'none';
  pipeT.style.display=pipeType==='T'?'block':'none';
  g.appendChild(wrap);
  board.appendChild(g);
  ghosts.push(g);

  setTimeout(()=>{
   g.style.left=(toC*cellW)+'px';
   g.style.top=(toR*cellH)+'px';
   g.style.transform='scale(1.02)';
  },delay);
 }

 placements.forEach((p,i)=>{
  const src=existingPipes[i%Math.max(1,existingPipes.length)]||{r:Math.floor(ROWS/2),c:Math.floor(COLS/2)};
  makeGhost(p.pipeType,p.rotation,src.r,src.c,p.r,p.c,20+i*22);
 });

 setTimeout(()=>{
  ghosts.forEach(g=>g.remove());
  placements.forEach(p=>{
   const cell=gridState[p.r][p.c];

function makeRandomObstacles(rows,cols){

   障碍生成规则：
   1. 总障碍数量约占全图 1/3。
   2. 少量单格，大部分为单排或 L 型。
   3. 每个成组障碍最多 5 格。
   4. 最终按八方向相邻合并后，障碍连通块数量至少 7 块。
      也就是：哪怕斜着挨着，也算同一块障碍。

  const blocked=new Set();

  function can(r,c){
   return r>=0&&r<rows&&c>=0&&c<cols&&!blocked.has(keyOf(r,c));
  }

  function add(r,c,temp){
   if(!can(r,c))return false;
   const k=keyOf(r,c);
   if(temp){
    if(temp.has(k))return false;
    temp.add(k);
   }else{
    blocked.add(k);
   }
   return true;
  }

  function randomCell(){
   return{r:randInt(rows),c:randInt(cols)};
  }

  function placeSingle(){
   for(let i=0;i<80;i++){
    const p=randomCell();
    if(add(p.r,p.c))return true;
   }
   return false;
  }

  function placeLine(){
   const len=2+randInt(4);
   const horizontal=Math.random()<.5;
   const p=randomCell();
   const temp=new Set();

   for(let i=0;i<len;i++){
    const r=p.r+(horizontal?0:i);
    const c=p.c+(horizontal?i:0);
    if(!add(r,c,temp))return false;
   }

   temp.forEach(k=>blocked.add(k));
   return true;
  }

  function placeL(){
   const total=3+randInt(3);
   const lenA=2+randInt(total-2);
   const lenB=total-lenA+1;
   const p=randomCell();
   const temp=new Set();
   const dirs=shuffle([
    [{dr:0,dc:1},{dr:1,dc:0}],
    [{dr:0,dc:1},{dr:-1,dc:0}],
    [{dr:0,dc:-1},{dr:1,dc:0}],
    [{dr:0,dc:-1},{dr:-1,dc:0}]
   ])[0];

   for(let i=0;i<lenA;i++){
    if(!add(p.r+dirs[0].dr*i,p.c+dirs[0].dc*i,temp))return false;
   }
   for(let j=1;j<lenB;j++){
    if(!add(p.r+dirs[1].dr*j,p.c+dirs[1].dc*j,temp))return false;
   }

   if(temp.size<3||temp.size>5)return false;
   temp.forEach(k=>blocked.add(k));
   return true;
  }

  let attempts=0;
  while(blocked.size<target&&attempts<target*100){
   attempts++;
   const x=Math.random();
   if(x<.22)placeSingle();
   else if(x<.76)placeLine();
   else placeL();
  }

  while(blocked.size<target&&attempts<target*150){
   attempts++;
   placeSingle();
  }

  return blocked;
 }

 let best=null;
 let bestComponents=-1;

 for(let attempt=0;attempt<120;attempt++){
  const blocked=buildOnce();
  const components=countObstacleComponents(blocked);
  if(components>=7)return blocked;
  if(components>bestComponents){
   bestComponents=components;
   best=blocked;
  }

  if(side==='top')for(let c=0;c<cols;c++)if(!blocked.has(keyOf(0,c)))arr.push({r:0,c,dir:0,side});

 // 且内侧周围 3x3 至少 3 个可走格。
 const inside={
  r:outlet.r+(outlet.dir===0?1:outlet.dir===2?-1:0),
  c:outlet.c+(outlet.dir===3?1:outlet.dir===1?-1:0)

function choosePorts(rows,cols,blocked){

  .filter(p=>isOutletAccessible(p,blocked,rows,cols));

 for(let t=0;t<900;t++){
  const ins=shuffle([...inletPool]).slice(0,3);
  if(ins.length<3)break;
  if(new Set(ins.map(p=>keyOf(p.r,p.c))).size<3)continue;

  // 三个进水口至少分布在两个边上。
  const inletSides=new Set(ins.map(p=>p.side));
  if(inletSides.size<2)continue;

  const out=outletPool[randInt(outletPool.length)];
  if(!out||ins.some(p=>p.r===out.r&&p.c===out.c))continue;

  // 不再追求四口尽量远，只要求有一定分散度；后续搜索最少组件路径。

function shortestPath(start,end,blocked,forbidden){

  const p=q.shift(),pk=keyOf(p.r,p.c);

   const nr=p.r+dr,nc=p.c+dc,nk=keyOf(nr,nc);

function generateCandidateTree(ports,blocked,m1,m2,order){

 function addPath(path){
  if(!path)return false;

 }

 p=shortestPath(ports.inlets[order[2]],m2,blocked,new Set([...occupied].filter(k=>k!==keyOf(m2.r,m2.c))));

 p=shortestPath(m2,ports.outlets[0],blocked,new Set([...occupied].filter(k=>k!==keyOf(m2.r,m2.c))));

  edges:finalEdges,

function generateRoutedLevel2(){

 for(let attempt=0;attempt<500;attempt++){
  const blocked=makeRandomObstacles(ROWS,COLS);
  const ports=choosePorts(ROWS,COLS,blocked);
  if(!ports)continue;

  const openCells=[];
  for(let r=1;r<ROWS-1;r++){
   for(let c=1;c<COLS-1;c++){
    if(!blocked.has(keyOf(r,c)))openCells.push({r,c});
   }
  }

  // 候选合流点靠近四口几何中心，目的是搜索“组件数量最少”的管网。
  const avgR=(ports.inlets[0].r+ports.inlets[1].r+ports.inlets[2].r+ports.outlets[0].r)/4;
  const avgC=(ports.inlets[0].c+ports.inlets[1].c+ports.inlets[2].c+ports.outlets[0].c)/4;
  const candidates=openCells
   .map(p=>({...p,score:Math.abs(p.r-avgR)+Math.abs(p.c-avgC)}))
   .sort((a,b)=>a.score-b.score)
   .slice(0,90);

  let best=null;
  const orders=[[0,1,2],[0,2,1],[1,2,0]];

  for(const m1 of candidates){
   for(const m2 of candidates){
    if(keyOf(m1.r,m1.c)===keyOf(m2.r,m2.c))continue;
    if(manhattan(m1,m2)<2)continue;
    for(const order of orders){
     const candidate=generateCandidateTree(ports,blocked,m1,m2,order);
     if(!candidate)continue;
     if(!best||candidate.componentCount<best.componentCount){
      best={...candidate,m1,m2,order};
     }
    }
   }
  }

  if(best){
   return{

    graph:best.graph

  }

}

 const visited=new Set(),q=[],offs=[{dr:-1,dc:0,opp:2},{dr:0,dc:1,opp:3},{dr:1,dc:0,opp:0},{dr:0,dc:-1,opp:1}];
 currentInlets.forEach(p=>{if(getCellConnections(p.r,p.c)[p.dir]){const k=keyOf(p.r,p.c);visited.add(k);q.push({r:p.r,c:p.c})}});
 while(q.length){const p=q.shift(),conns=getCellConnections(p.r,p.c);for(let d=0;d<4;d++)if(conns[d]){const nr=p.r+offs[d].dr,nc=p.c+offs[d].dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&getCellConnections(nr,nc)[offs[d].opp]){const k=keyOf(nr,nc);if(!visited.has(k)){visited.add(k);q.push({r:nr,c:nc})}}}}
 return visited;
}
function findLeakPoints(flooded){
 const leaks=[],offs=[{dr:-1,dc:0,opp:2},{dr:0,dc:1,opp:3},{dr:1,dc:0,opp:0},{dr:0,dc:-1,opp:1}];
 flooded.forEach(k=>{const{r,c}=parseKey(k),cell=gridState[r][c];if(!cell||cell.isBroken)return;const conns=getCellConnections(r,c);for(let d=0;d<4;d++)if(conns[d]){if(currentOutlets.some(p=>p.r===r&&p.c===c&&p.dir===d)||currentInlets.some(p=>p.r===r&&p.c===c&&p.dir===d))continue;const nr=r+offs[d].dr,nc=c+offs[d].dc;let leak=false;if(nr<0||nr>=ROWS||nc<0||nc>=COLS)leak=true;else if(!getCellConnections(nr,nc)[offs[d].opp])leak=true;if(leak)leaks.push({r,c,dir:d})}});
 return leaks;
}
function getFloodedComponents(flooded){
 const visited=new Set(),components=[],offs=[{dr:-1,dc:0,opp:2},{dr:0,dc:1,opp:3},{dr:1,dc:0,opp:0},{dr:0,dc:-1,opp:1}];
 flooded.forEach(start=>{if(visited.has(start))return;const q=[start],cells=[];visited.add(start);let hasInlet=false,hasOutlet=false,hasLeak=false;while(q.length){const k=q.shift();cells.push(k);const{r,c}=parseKey(k),conns=getCellConnections(r,c);for(let d=0;d<4;d++)if(conns[d]){const isIn=currentInlets.some(p=>p.r===r&&p.c===c&&p.dir===d),isOut=currentOutlets.some(p=>p.r===r&&p.c===c&&p.dir===d);if(isIn)hasInlet=true;if(isOut)hasOutlet=true;const nr=r+offs[d].dr,nc=c+offs[d].dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){if(getCellConnections(nr,nc)[offs[d].opp]){const nk=keyOf(nr,nc);if(flooded.has(nk)&&!visited.has(nk)){visited.add(nk);q.push(nk)}}else if(!isIn&&!isOut)hasLeak=true}else if(!isIn&&!isOut)hasLeak=true}}components.push({cells,hasInlet,hasOutlet,hasLeak})});
 return components;
}
function updateGameState(){
 const flooded=checkConnectivity(),components=getFloodedComponents(flooded);let broken=false;
 for(const comp of components)if(comp.hasInlet&&!comp.hasOutlet&&!comp.hasLeak){const cand=[];comp.cells.forEach(k=>{const{r,c}=parseKey(k),cell=gridState[r][c];if(cell.type==='pipe'&&!cell.isBroken&&(cell.pipeType==='I'||cell.pipeType==='L'))cand.push(cell)});if(cand.length){const ch=cand[randInt(cand.length)];ch.isBroken=true;ch.brokenTime=Date.now();broken=true}}
 if(broken){playDangerSound();return updateGameState()}
 renderGrid(flooded);
 const reaches=currentOutlets.some(p=>flooded.has(keyOf(p.r,p.c))&&getCellConnections(p.r,p.c)[p.dir]);
 const allIn=currentLevel===1||currentInlets.every(p=>flooded.has(keyOf(p.r,p.c))&&getCellConnections(p.r,p.c)[p.dir]);
 if(reaches&&allIn&&findLeakPoints(flooded).length===0){document.querySelectorAll('.wall-outlet').forEach(e=>e.classList.add('flooded-outlet'));endGame(true)}
}
function renderGrid(flooded=new Set()){
 document.getElementById('badge-I').textContent=`x${inventory.I}`;document.getElementById('badge-L').textContent=`x${inventory.L}`;document.getElementById('badge-T').textContent=`x${inventory.T}`;
 ['I','L','T'].forEach(t=>document.getElementById(`btn-${t}`).classList.toggle('empty-inventory',inventory[t]===0));
 const leaks=findLeakPoints(flooded),showHint=currentLevel===1;
 const brokenLeaks=[];
 const activeInlets=currentInlets.filter(p=>!getCellConnections(p.r,p.c)[p.dir]);
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cell=gridState[r][c],dom=cell.dom;if(!dom)continue;let cls='cell';if(flooded.has(keyOf(r,c)))cls+=' flooded';if(cell.type==='obstacle')cls+=' obstacle';if(cell.isBroken)cls+=' pipe-shatter';if(showHint&&cell.isSolution&&cell.type!=='obstacle')cls+=' solution-hint';dom.cellEl.className=cls;
  if(cell.type==='pipe'){dom.wrapper.style.display='block';dom.wrapper.className=`pipe-wrapper rot-${cell.rotation}`;dom.pipeI.style.display=cell.pipeType==='I'?'block':'none';dom.pipeL.style.display=cell.pipeType==='L'?'block':'none';dom.pipeT.style.display=cell.pipeType==='T'?'block':'none'}else dom.wrapper.style.display='none';
  if(cell.isBroken){
   const dirs=[0,1,2,3].filter(d=>getPipeConnectionsForVisual(cell)[d]);
   if(dirs.length)dirs.forEach(dir=>brokenLeaks.push({r,c,dir}));
   else brokenLeaks.push({r,c,dir:2});
  }
 }
 waterEffects?.setScene({flooded,leaks,brokenCells:brokenLeaks,inlets:activeInlets});
 waterEffects?.setWaterLevel(waterLevel);
}
function setPauseState(nextPaused){
 if(!hasStartedGame)return;
 isPaused=nextPaused;
 const board=document.getElementById('board-wrapper');
 const overlay=document.getElementById('pause-overlay');
 const btn=document.getElementById('pause-toggle');
 board.classList.toggle('paused',isPaused);
 overlay.classList.toggle('active',isPaused);
 btn.classList.toggle('paused',isPaused);
 btn.textContent=isPaused?'继续':'暂停';
}
function togglePause(){
 ensureAudioContext();
 startBGM();
 if(!hasStartedGame||isGameOver)return;
 setPauseState(!isPaused);
 playSound(isPaused?640:420,'sine',.08);
}
function useFreeze(){ensureAudioContext();startBGM();if(isGameOver||isPaused||isFrozen||freezeCount<=0){playSound(150,'square',.2);return}freezeCount--;document.getElementById('count-freeze').textContent=freezeCount;document.getElementById('btn-freeze').classList.toggle('disabled',freezeCount<=0);isFrozen=true;freezeTicksRemaining=60;document.getElementById('board-wrapper').classList.add('frozen');playFreezeSound()}
function usePump(){ensureAudioContext();startBGM();if(isGameOver||isPaused||pumpCount<=0||waterLevel<=0){playSound(150,'square',.2);return}pumpCount--;document.getElementById('count-pump').textContent=pumpCount;document.getElementById('btn-pump').classList.toggle('disabled',pumpCount<=0);const dur=(currentLevel===1?LEVEL1:LEVEL2).duration,total=dur*10;currentStep=Math.max(0,currentStep-total*.5);waterLevel=currentStep/total*100;document.getElementById('water-mask').style.height=`${waterLevel}%`;document.getElementById('water-text').textContent=Math.floor(waterLevel);playPumpSound();updateGameState()}
function startTimer(){
 const interval=100,dur=(currentLevel===1?LEVEL1:LEVEL2).duration,total=dur*10;currentStep=0;clearInterval(timerInterval);
 timerInterval=setInterval(()=>{if(isGameOver||isPaused)return;const now=Date.now();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cell=gridState[r][c];if(cell.isBroken&&now-cell.brokenTime>=1500){gridState[r][c]={type:'empty',isBroken:false,brokenTime:null,dom:cell.dom,isSolution:cell.isSolution}}}
 if(isFrozen){freezeTicksRemaining--;if(freezeTicksRemaining<=0){isFrozen=false;document.getElementById('board-wrapper').classList.remove('frozen')}}
 const flooded=checkConnectivity(),leakCount=findLeakPoints(flooded).length;let speed=isFrozen?0:(1+leakCount*.28)*1.2;if(currentLevel===2)speed*=0.82;currentStep+=speed;waterLevel=Math.min(currentStep/total*100,100);
 document.getElementById('water-mask').style.height=`${waterLevel}%`;document.getElementById('water-text').textContent=Math.floor(waterLevel);const left=Math.ceil(Math.max(0,total-currentStep)/10);document.getElementById('timer-text').textContent=left;
 waterEffects?.setWaterLevel(waterLevel);
 const w=document.getElementById('water-text'),t=document.getElementById('timer-text');w.style.color=leakCount>0&&!isFrozen?'#e74c3c':'#ecf0f1';w.style.transform=leakCount>0&&!isFrozen?'scale(1.2)':'scale(1)';t.style.color=left<=15&&currentLevel===2&&!isFrozen?'#e74c3c':'#ecf0f1';t.style.transform=left<=15&&currentLevel===2&&!isFrozen?'scale(1.15)':'scale(1)';
 renderGrid(flooded);if(waterLevel>=100)endGame(false);
 },interval)
}
function endGame(win){
 if(isGameOver)return;isGameOver=true;isPaused=false;clearInterval(timerInterval);levelWon=win;const m=document.getElementById('modal'),title=document.getElementById('modal-title'),btn=document.getElementById('modal-btn');m.className='';m.style.display='flex';setPauseState(false);
 if(win){let stars=waterLevel<=25?'⭐⭐⭐':waterLevel<=60?'⭐⭐':'⭐';const rem=inventory.I+inventory.L+inventory.T,levelScore=Math.round((100-waterLevel)*10)+currentLevel*100+(rem<=2?300:0);score+=levelScore;document.getElementById('score-text').textContent=score;
  if(currentLevel===1){title.innerHTML=`🎉 教学关通过！<br><span style="font-size:20px;color:#f1c40f">${stars}</span><br><span style="font-size:13px;color:#bdc3c7">下一关需要把所有进水口都接到出水口。</span>`;btn.textContent='进入第二关'}
  else{title.innerHTML=`🏆 第二关破解！<br><span style="font-size:20px;color:#f1c40f">${stars}</span><br><span style="font-size:13px;color:#bdc3c7">总分: ${score}</span><br><span style="font-size:12px;color:#2ecc71">点击后刷新新的第二关，不返回第一关。</span>`;btn.textContent='刷新第二关'}
  playSound(523,'sine',.15);setTimeout(()=>playSound(659,'sine',.15),150);setTimeout(()=>playSound(784,'sine',.3),300)
 }else{m.className='fail-modal';title.innerHTML=`💀 房间被淹没了...<br><span style="font-size:14px;color:#bdc3c7">敞口会漏水加速上涨；完全闭合且无出口的通水死路会随机爆管。</span>`;btn.textContent='重新挑战';playSound(300,'sawtooth',.4);setTimeout(()=>playSound(200,'sawtooth',.6),200)}
}
function nextLevelOrReset(){if(levelWon){if(currentLevel===1)currentLevel=2;else currentLevel=2}else{if(currentLevel===1)score=0}document.getElementById('level-text').textContent=currentLevel;document.getElementById('score-text').textContent=score;resetGame()}
function resetGame(){
 isGameOver=false;levelWon=false;answerRevealMode=false;waitingForNextAfterReveal=false;waterLevel=0;currentStep=0;isFrozen=false;freezeTicksRemaining=0;isPaused=false;clearInterval(timerInterval);document.getElementById('board-wrapper').classList.remove('frozen');document.getElementById('water-mask').style.height='0%';document.getElementById('water-text').textContent='0';document.getElementById('modal').className='';document.getElementById('modal').style.display='none';document.querySelectorAll('.wall-outlet').forEach(e=>e.classList.remove('flooded-outlet'));waterEffects?.reset();waterEffects?.setWaterLevel(0);setPauseState(false);
 if(currentLevel===1){generateLevel1();document.getElementById('timer-text').textContent=LEVEL1.duration;document.getElementById('tip-text').innerHTML='第一关是教学关：黄色格子就是唯一通道，组件刚好够用。点击已放好的同类水管可旋转。'}
 else{generateLevel2();document.getElementById('timer-text').textContent=LEVEL2.duration;document.getElementById('tip-text').innerHTML='<strong>第二关：</strong>把所有进水口都连到出水口，小心漏水和爆管。'}
 document.getElementById('count-freeze').textContent=freezeCount;document.getElementById('count-pump').textContent=pumpCount;document.getElementById('btn-freeze').classList.toggle('disabled',freezeCount<=0);document.getElementById('btn-pump').classList.toggle('disabled',pumpCount<=0);
 createGridDOM();updateBoardLayout();renderWallPorts();renderGrid();startTimer();
}
function updateOrientationHint(){
 const shouldWarn=window.matchMedia('(orientation: landscape)').matches&&window.innerWidth<980;
 document.body.classList.toggle('landscape-warning',shouldWarn);
}
function hideBrowserChrome(){
 if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone)return;
 setTimeout(()=>window.scrollTo(0,1),60);
}
function registerPwaSupport(){
 updateOrientationHint();
 hideBrowserChrome();
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
 }
}
function bindUiEvents(){
 const introBtn=document.getElementById('intro-start-btn');
 const pauseBtn=document.getElementById('pause-toggle');
 const resumeBtn=document.getElementById('pause-resume-btn');
 if(introBtn)introBtn.addEventListener('click',beginGameFromIntro);
 if(pauseBtn)pauseBtn.addEventListener('click',togglePause);
 if(resumeBtn)resumeBtn.addEventListener('click',togglePause);
 window.beginGameFromIntro=beginGameFromIntro;
 window.togglePause=togglePause;
 window.nextLevelOrReset=nextLevelOrReset;
 window.revealAnswer=revealAnswer;
}
function bootstrapUi(){
 document.getElementById('level-text').textContent=currentLevel;
 document.getElementById('score-text').textContent=score;
 waterEffects=new WaterParticleSystem(document.getElementById('water-effects-canvas'));
 waterEffects.start();
 bindUiEvents();
 registerPwaSupport();
 const handleViewportChange=()=>requestAnimationFrame(()=>{updateBoardLayout();renderWallPorts();updateOrientationHint();hideBrowserChrome()});
 window.addEventListener('resize',handleViewportChange);
 window.visualViewport?.addEventListener('resize',handleViewportChange);
 window.addEventListener('orientationchange',handleViewportChange);
 window.addEventListener('pageshow',()=>setTimeout(hideBrowserChrome,0));
 setTimeout(()=>beginGameFromIntro(),1800);
}
if(document.readyState==='loading'){
 document.addEventListener('DOMContentLoaded',bootstrapUi,{once:true});
}else{
 bootstrapUi();
}
</script>
